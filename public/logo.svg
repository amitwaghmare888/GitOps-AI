<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gitopsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="intelGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ECF8E" />
      <stop offset="100%" stop-color="#38B2AC" />
    </linearGradient>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <polygon points="250,50 410,140 410,360 250,450 90,360 90,140" 
           fill="#070D19" stroke="url(#gitopsGrad)" stroke-width="4" stroke-linejoin="round"/>

  <path d="M 180 250 C 180 190, 230 150, 250 250 C 270 350, 320 310, 320 250 C 320 190, 270 150, 250 250 C 230 350, 180 310, 180 250 Z" 
        fill="none" stroke="url(#gitopsGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <g stroke="url(#intelGrad)" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M 120 200 L 160 250 L 120 300" opacity="0.7"/>
    <path d="M 380 200 L 340 250 L 380 300" opacity="0.7"/>
    <line x1="140" y1="250" x2="360" y2="250" stroke="#1E293B" stroke-width="8"/>
  </g>

  <g fill="#070D19" stroke-width="5">
    <circle cx="180" cy="250" r="12" stroke="#3B82F6" />
    <circle cx="180" cy="250" r="4" fill="#3B82F6" />
    
    <circle cx="320" cy="250" r="12" stroke="#8B5CF6" />
    <circle cx="320" cy="250" r="4" fill="#8B5CF6" />

    <circle cx="215" cy="200" r="6" stroke="#3ECF8E" fill="#3ECF8E" filter="url(#neonGlow)"/>
    <circle cx="285" cy="300" r="6" stroke="#38B2AC" fill="#38B2AC" filter="url(#neonGlow)"/>
  </g>

  <g filter="url(#neonGlow)">
    <polygon points="250,215 280,250 250,285 220,250" fill="url(#gitopsGrad)" />
    <circle cx="250" cy="250" r="6" fill="#FFFFFF" />
  </g>
</svg>
